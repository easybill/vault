[package]
name = "vault"
version = "1.0.31"
authors = ["Plattform Team <server@easybill.de>"]
edition = "2024"

[dependencies]
anyhow = { version = "1", features = ["backtrace"] }
byteorder = "1"
clap = "4"
dirs = "7"
globset = "0.4"
openssl = { version = "0.10", features = ["vendored"] }
regex = "1"
semver = "1"
serde = "1"
serde_derive = "1"
serde_json = "1"
toml = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = "fat"

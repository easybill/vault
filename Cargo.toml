[package]
name = "vault"
version = "1.0.29"
authors = ["timglabisch <glabisch@easybill.de>"]
edition = "2024"

[dependencies]
openssl = { version = "0.10", features = ["vendored"] }
ml-kem = { version = "=0.3.0-rc.2", features = ["pkcs8", "pem", "alloc", "zeroize"] }
rand = "0.10"
der = { version = "0.8", features = ["pem"] }
aes-gcm = "0.10"
hkdf = "0.13"
sha3 = "0.11"
toml = "1"
serde_derive = "1"
serde_json = "1"
serde = "1"
clap = "4"
regex = "1"
anyhow = { version = "1", features = ["backtrace"] }
byteorder = "1"
dirs = "6"
globset = "0.4"
self_update = "0.44"
semver = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = "fat"
